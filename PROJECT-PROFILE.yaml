project: dfarming
repository: domenicomassafra/dFarming
lineage:
  ios: domenicomassafra/Kevs-IOS-Agents
  upstream_kevs: kevinbadi/Kevs-IOS-Agents
status: active
authority:
  control_plane: minipc
  branch: main
runtime:
  node: ">=22"
  database: PostgreSQL
  scheduler: pg-boss
  ios_physical: WebDriverAgent
  ios_simulator: Appium-XCUITest
  android_physical: ADB-Appium-UiAutomator2
  android_emulator: Android-Emulator-Appium-UiAutomator2
principles:
  - donor-first
  - one-control-plane
  - one-scheduler
  - deterministic-workflows-before-agentic-fallbacks
  - platform-transports-behind-adapters
  - account-and-session-isolation
  - evidence-before-runtime-claims
  - owner-controlled-devices-and-accounts-only
source_gate: npm run check
production_gate: exact-main-sha plus MiniPC health plus reachable-runtime acceptance
